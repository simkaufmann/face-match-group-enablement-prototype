<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Match Group Enablement — Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF8F5;--warm-white:#FFFFFF;--warm-gray-1:#F5F3F0;--warm-gray-2:#EDEAE6;
  --warm-gray-3:#D6D2CC;--warm-gray-4:#B8B3AC;--warm-gray-5:#8B8680;
  --warm-dark:#2C2C2C;--warm-dark-2:#4A4744;--warm-dark-3:#6B6660;
  --accent:#D4654A;--accent-light:#FDF0EC;
  --blue:#3C7BD4;--blue-light:#EBF2FC;
  --amber:#D4A03C;--amber-light:#FDF6EB;
  --teal:#3CAAA0;--teal-light:#EBF8F7;
  --rose:#C4556A;--rose-light:#FCECEF;
  --motive-navy:#1B2A4A;--motive-blue:#2563EB;
  --serif:'Newsreader',Georgia,serif;--sans:'Karla',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--warm-dark);font-family:var(--sans)}

/* Top bar */
.top-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--warm-white);border-bottom:1px solid var(--warm-gray-2);font-size:0.75rem;color:var(--warm-gray-5)}
.top-bar .title{font-weight:700;color:var(--warm-dark);font-size:0.8rem;letter-spacing:0.02em}
.top-bar kbd{display:inline-block;padding:1px 6px;border:1px solid var(--warm-gray-3);border-radius:3px;font-size:0.7rem;background:var(--warm-gray-1);margin:0 2px}

/* Main panels */
.panels{display:flex;height:calc(100% - 40px - 52px)}
.lhs{width:50%;overflow-y:auto;padding:32px;background:var(--warm-gray-1);display:flex;flex-direction:column;align-items:center}
.rhs{width:50%;overflow-y:auto;padding:32px 36px;background:var(--warm-white);border-left:1px solid var(--warm-gray-2)}

/* State tag */
.state-tag{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--warm-gray-5);margin-bottom:12px}

/* Web frame */
.web-frame{width:100%;max-width:680px;background:var(--warm-white);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06);overflow:hidden;border:1px solid var(--warm-gray-2)}
.web-nav{background:var(--motive-navy);padding:10px 16px;display:flex;align-items:center;gap:12px}
.web-nav .logo{font-weight:800;color:#fff;font-size:0.85rem;letter-spacing:0.04em}
.web-nav .nav-item{color:rgba(255,255,255,0.6);font-size:0.75rem;cursor:default}
.web-nav .nav-item.active{color:#fff;border-bottom:2px solid var(--motive-blue)}
.web-breadcrumb{padding:8px 16px;font-size:0.72rem;color:var(--warm-gray-5);border-bottom:1px solid var(--warm-gray-2)}
.web-breadcrumb span{color:var(--motive-blue)}
.web-content{padding:20px 16px;min-height:300px}

/* Settings components */
.settings-section{margin-bottom:20px}
.settings-label{font-size:0.8rem;font-weight:700;color:var(--warm-dark);margin-bottom:8px}
.settings-sublabel{font-size:0.72rem;color:var(--warm-gray-5);margin-bottom:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--warm-gray-1);border-radius:8px;margin-bottom:8px}
.toggle-row .label{font-size:0.8rem;font-weight:700}
.toggle-row .sub{font-size:0.7rem;color:var(--warm-gray-5);margin-top:2px}
.toggle{width:36px;height:20px;border-radius:10px;position:relative;cursor:default;flex-shrink:0}
.toggle.on{background:var(--motive-blue)}
.toggle.off{background:var(--warm-gray-3)}
.toggle::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on::after{left:18px}
.toggle.off::after{left:2px}

/* Group picker */
.group-picker{border:1px solid var(--warm-gray-3);border-radius:8px;padding:12px;background:var(--warm-white);margin-top:8px}
.group-picker .gp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.group-picker .gp-title{font-size:0.75rem;font-weight:700;color:var(--warm-dark)}
.group-picker .gp-count{font-size:0.7rem;color:var(--motive-blue);font-weight:700}
.group-row{display:flex;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:4px;font-size:0.78rem;gap:8px}
.group-row:hover{background:var(--warm-gray-1)}
.group-row .cb{width:16px;height:16px;border:2px solid var(--warm-gray-3);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.group-row .cb.checked{background:var(--motive-blue);border-color:var(--motive-blue)}
.group-row .cb.checked::after{content:'\2713';color:#fff;font-size:0.6rem;font-weight:700}
.group-row .g-name{font-weight:700;color:var(--warm-dark)}
.group-row .g-count{color:var(--warm-gray-5);font-size:0.7rem}
.group-row .g-badge{font-size:0.6rem;padding:2px 6px;border-radius:4px;font-weight:700}
.badge-enabled{background:#dcfce7;color:#166534}
.badge-disabled{background:var(--warm-gray-1);color:var(--warm-gray-5)}

/* Focus ring */
.focus-ring{box-shadow:0 0 0 3px var(--blue),0 0 12px rgba(60,123,212,0.15)!important;border-radius:10px}

/* Profile card */
.profile-card{border:1px solid var(--warm-gray-2);border-radius:10px;padding:16px;margin-bottom:12px}
.profile-card .pc-name{font-size:0.82rem;font-weight:700;color:var(--warm-dark)}
.profile-card .pc-desc{font-size:0.7rem;color:var(--warm-gray-5);margin-top:2px}
.profile-card .pc-groups{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.profile-card .pc-chip{font-size:0.65rem;padding:3px 8px;border-radius:12px;background:var(--blue-light);color:var(--blue);font-weight:700}
.profile-card .pc-setting{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:var(--warm-gray-1);border-radius:6px}
.profile-card .pc-setting .s-name{font-size:0.75rem;font-weight:700}

/* Sync indicator */
.sync-indicator{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:var(--blue-light);border:1px solid rgba(60,123,212,0.2);margin-bottom:12px}
.sync-indicator .si-icon{font-size:1rem}
.sync-indicator .si-text{font-size:0.72rem;color:var(--blue);font-weight:700}

/* Inheritance table */
.inh-table{width:100%;border-collapse:collapse;font-size:0.72rem;margin-top:8px}
.inh-table th{text-align:left;padding:6px 8px;background:var(--warm-gray-1);color:var(--warm-gray-5);font-weight:700;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em}
.inh-table td{padding:6px 8px;border-bottom:1px solid var(--warm-gray-2)}
.inh-table .src{font-size:0.6rem;padding:2px 6px;border-radius:4px;font-weight:700}
.src-company{background:var(--amber-light);color:var(--amber)}
.src-group{background:var(--blue-light);color:var(--blue)}
.src-vehicle{background:var(--teal-light);color:var(--teal)}
.src-inherited{background:#dcfce7;color:#166534}

/* Trip result */
.trip-result{border:1px solid var(--warm-gray-2);border-radius:10px;padding:16px;margin-bottom:12px}
.trip-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.trip-avatar{width:36px;height:36px;border-radius:50%;background:var(--warm-gray-2);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:var(--warm-gray-5)}
.trip-meta{font-size:0.72rem}
.trip-meta .tm-name{font-weight:700;color:var(--warm-dark)}
.trip-meta .tm-sub{color:var(--warm-gray-5)}
.trip-status{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;font-size:0.72rem;font-weight:700}
.ts-matched{background:#dcfce7;color:#166534}
.ts-blocked{background:var(--rose-light);color:var(--rose)}
.ts-unmatched{background:var(--amber-light);color:var(--amber)}

/* Audit log */
.audit-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--warm-gray-2);font-size:0.72rem}
.audit-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.audit-content .ac-action{font-weight:700;color:var(--warm-dark)}
.audit-content .ac-detail{color:var(--warm-gray-5);margin-top:2px}
.audit-content .ac-time{color:var(--warm-gray-4);font-size:0.65rem;margin-top:2px}

/* Info callout */
.info-callout{padding:10px 14px;border-radius:8px;font-size:0.72rem;margin-top:12px;display:flex;align-items:flex-start;gap:8px}
.info-callout .ic-icon{font-size:0.85rem;flex-shrink:0}
.ic-blue{background:var(--blue-light);border:1px solid rgba(60,123,212,0.15);color:var(--blue)}
.ic-amber{background:var(--amber-light);border:1px solid rgba(212,160,60,0.15);color:var(--amber)}
.ic-green{background:#dcfce7;border:1px solid rgba(22,101,52,0.15);color:#166534}

/* New vehicle highlight */
.new-badge{display:inline-block;font-size:0.6rem;padding:2px 6px;border-radius:4px;background:var(--accent-light);color:var(--accent);font-weight:700;margin-left:6px}

/* RHS styles */
.r-step-badge{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--warm-gray-4);margin-bottom:16px}
.r-hero h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.35;color:var(--warm-dark);margin-bottom:8px}
.r-hero h2 em{color:var(--accent);font-style:italic}
.r-hero p{font-size:0.88rem;color:var(--warm-gray-5);line-height:1.5;margin-bottom:24px}
.r-section{margin-bottom:20px}
.r-section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.r-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.r-dot-blue{background:var(--blue)}
.r-dot-amber{background:var(--amber)}
.r-dot-teal{background:var(--teal)}
.r-dot-rose{background:var(--rose)}
.r-section-label{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--warm-gray-5)}
.r-body{font-size:0.85rem;line-height:1.6;color:var(--warm-dark-2)}
.r-body p{margin-bottom:10px}

/* Quote block */
.r-quote{background:var(--warm-gray-1);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.r-quote::before{content:'\201C';position:absolute;top:-8px;left:8px;font-family:var(--serif);font-size:4rem;color:rgba(0,0,0,0.04)}
.r-quote .q-text{font-family:var(--serif);font-size:0.88rem;font-style:italic;color:var(--warm-dark);line-height:1.5;position:relative;z-index:1}
.r-quote .q-attr{font-size:0.72rem;color:var(--warm-gray-5);margin-top:6px;position:relative;z-index:1}
.r-quote .q-attr strong{color:var(--warm-dark-2)}
.r-quote.q-blue{border-left-color:var(--blue)}
.r-quote.q-amber{border-left-color:var(--amber)}
.r-quote.q-rose{border-left-color:var(--rose)}

/* Stat row */
.r-stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.r-stat{background:var(--warm-gray-1);border-radius:8px;padding:12px 16px;flex:1;min-width:100px}
.r-stat .s-num{font-family:var(--serif);font-size:1.4rem;font-weight:500;color:var(--accent)}
.r-stat .s-label{font-size:0.7rem;color:var(--warm-gray-5);margin-top:2px}

/* Decision callout */
.r-call{padding:14px 16px;border-radius:8px;margin-bottom:16px}
.r-call.call-rose{background:var(--rose-light);border:1px solid rgba(196,85,106,0.15)}
.r-call.call-blue{background:var(--blue-light);border:1px solid rgba(60,123,212,0.15)}
.r-call .rc-header{font-size:0.68rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
.r-call.call-rose .rc-header{color:var(--rose)}
.r-call.call-blue .rc-header{color:var(--blue)}
.r-call .rc-body{font-size:0.82rem;line-height:1.5;color:var(--warm-dark-2)}

/* Bottom bar */
.bottom-bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--warm-white);border-top:1px solid var(--warm-gray-2)}
.bottom-bar .step-title{font-size:0.78rem;font-weight:700;color:var(--warm-dark);flex:1;text-align:center}
.nav-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--warm-gray-3);background:var(--warm-white);font-family:var(--sans);font-size:0.78rem;font-weight:700;color:var(--warm-dark);cursor:pointer;transition:all .15s}
.nav-btn:hover{background:var(--warm-gray-1);border-color:var(--warm-gray-4)}
.nav-btn:disabled{opacity:0.3;cursor:default}
.nav-btn.primary{background:var(--motive-blue);color:#fff;border-color:var(--motive-blue)}
.nav-btn.primary:hover{background:#1d4ed8}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warm-gray-3);cursor:pointer;transition:all .2s}
.dot.active{width:20px;background:var(--motive-blue)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">Face Match Group Enablement — Concept</div>
  <div>Navigate: <kbd>←</kbd> <kbd>→</kbd> arrow keys</div>
</div>

<div class="panels">
  <div class="lhs" id="lhs"></div>
  <div class="rhs" id="rhs"></div>
</div>

<div class="bottom-bar">
  <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Prev</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
    <div class="step-title" id="stepTitle"></div>
    <div class="dots" id="dots"></div>
  </div>
  <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
</div>

<script>
const STEPS = [
  {
    title: "Current State — Fleet-Wide Toggle",
    lhs: () => `
      <div class="state-tag">S1 — Current experience</div>
      <div class="web-frame">
        <div class="web-nav">
          <div class="logo">MOTIVE</div>
          <div class="nav-item">Fleet Dashboard</div>
          <div class="nav-item active">Admin</div>
          <div class="nav-item">Safety</div>
        </div>
        <div class="web-breadcrumb">Admin › Fleet Settings › <span>Driver Identification</span></div>
        <div class="web-content">
          <div class="settings-section">
            <div class="settings-label">Driver Identification Methods</div>
            <div class="settings-sublabel">Configure how drivers are identified and matched to trips.</div>
            <div class="toggle-row">
              <div><div class="label">Driver App Pairing</div><div class="sub">Drivers log in via the Motive Driver App</div></div>
              <div class="toggle on"></div>
            </div>
            <div class="toggle-row">
              <div><div class="label">Static Pairing</div><div class="sub">Permanently assign drivers to vehicles</div></div>
              <div class="toggle on"></div>
            </div>
            <div class="toggle-row focus-ring" style="border:2px solid var(--blue)">
              <div><div class="label">Face Match</div><div class="sub">Use AI dashcam to identify drivers by facial recognition</div></div>
              <div class="toggle on"></div>
            </div>
            <div class="info-callout ic-amber">
              <div class="ic-icon">⚠️</div>
              <div>Face Match is currently <strong>fleet-wide</strong>. When enabled, it applies to all vehicles with an AI Dashcam Plus. There is no way to enable for specific groups.</div>
            </div>
            <div class="toggle-row">
              <div><div class="label">Smart Trip Match</div><div class="sub">Automatically match unidentified trips using historical data</div></div>
              <div class="toggle on"></div>
            </div>
          </div>
        </div>
      </div>`,
    rhs: () => `
      <div class="r-step-badge">1 / 9 step</div>
      <div class="r-hero">
        <h2>Face Match is <em>all-or-nothing</em></h2>
        <p>Today, enabling Face Match is a single fleet-wide toggle. There is no way for fleet admins to selectively enable it for specific vehicle groups.</p>
      </div>
      <div class="r-section">
        <div class="r-section-header"><div class="r-dot r-dot-blue"></div><div class="r-section-label">Design Direction</div></div>
        <div class="r-body"><p>The highlighted toggle is the only Face Match control available. Flipping it enables facial recognition across every vehicle with an AI Dashcam Plus — regardless of region, division, or union agreements.</p></div>
      </div>
      <div class="r-section">
        <div class="r-section-header"><div class="r-dot r-dot-amber"></div><div class="r-section-label">Data</div></div>
        <div class="r-stats">
          <div class="r-stat"><div class="s-num">6+</div><div class="s-label">Manual enablement tickets filed</div></div>
          <div class="r-stat"><div class="s-num">3+</div><div class="s-label">Repeat rounds for KLX alone</div></div>
        </div>
      </div>
      <div class="r-section">
        <div class="r-section-header"><div class="r-dot r-dot-teal"></div><div class="r-section-label">User Voice</div></div>
        <div class="r-quote">
          <div class="q-text">Only want these vehicles enabled to test the product before releasing to their entire fleet.</div>
          <div class="q-attr"><strong>KLX</strong> — ACOM-4167</div>
        </div>
      </div>`
  },
  {
    title: "The Problem — Manual Script Workflow",
    lhs: () => `
      <div class="state-tag">S2 — Current workaround</div>
      <div class="web-frame">
        <div class="web-nav">
          <div class="logo">MOTIVE</div>
          <div class="nav-item">Fleet Dashboard</div>
          <div class="nav-item active">Admin</div>
        </div>
        <div class="web-breadcrumb">Slack › <span>#fleet-foundation</span></div>
        <div class="web-content" style="background:#f8f5f1;padding:16px">
          <div style="font-size:0.7rem;color:var(--warm-gray-5);margin-bottom:12px;font-weight:700">Current Process: How Face Match Gets Enabled for a Subset</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;gap:10px;align-items:flex-start">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:var(--blue);flex-shrink:0">SK</div>
              <div style="background:var(--warm-white);border-radius:0 10px 10px 10px;padding:10px 14px;font-size:0.78rem;max-width:85%">
                <div style="font-weight:700;font-size:0.72rem;margin-bottom:4px;color:var(--warm-dark)">Simon Kaufmann</div>
                Enable Face Match for set of vehicles for Strat fleet. Created a ticket here — <span style="color:var(--motive-blue)">DI-1713</span>. Can we pick up running the script we've used in the past to only enable face match for a limited set of vehicles?
              </div>
            </div>
            <div style="display:flex;gap:10px;align-items:flex-start">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:var(--teal);flex-shrink:0">SM</div>
              <div style="background:var(--warm-white);border-radius:0 10px 10px 10px;padding:10px 14px;font-size:0.78rem;max-width:85%">
                <div style="font-weight:700;font-size:0.72rem;margin-bottom:4px;color:var(--warm-dark)">Saravana Mahesh</div>
                Yes I can take this.
              </div>
            </div>
            <div style="border-left:3px solid var(--rose);padding:10px 14px;border-radius:0 8px 8px 0;background:var(--rose-light);margin-top:8px">
              <div style="font-size:0.68rem;font-weight:700;color:var(--rose);margin-bottom:4px">CURRENT WORKFLOW</div>
              <div style="font-size:0.72rem;color:var(--warm-dark-2);line-height:1.5">
                1. Customer requests subset enablement → CSM creates Jira ticket<br>
                2. PM triages and tags on-call DI engineer<br>
                3. Engineer runs manual script against production DB<br>
                4. Manual validation that correct vehicles are enabled<br>
                5. Repeat for every group change or new customer request
              </div>
            </div>
            <div style="display:flex;gap:10px;align-items:flex-start;margin-top:4px">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--amber-light);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:var(--amber);flex-shrink:0">US</div>
              <div style="background:var(--warm-white);border-radius:0 10px 10px 10px;padding:10px 14px;font-size:0.78rem;max-width:85%">
                <div style="font-weight:700;font-size:0.72rem;margin-bottom:4px;color:var(--warm-dark)">Usman Saeed</div>
                +1 for group level face match enablement in near future, possibly H2. This will solve all these issues, fleets can enable the face match for the group and add/remove vehicles to the group.
              </div>
            </div>
          </div>
        </div>
      </div>`,
    rhs: () => `
      <div class="r-step-badge">2 / 9 step</div>
      <div class="r-hero">
        <h2>Every enablement requires <em>engineering</em></h2>
        <p>No self-service path exists. Every subset enablement request goes through Slack, Jira, and a manual production script.</p>
      </div>
      <div class="r-section">
        <div class="r-section-header"><div class="r-dot r-dot-teal"></div><div class="r-section-label">User Voice</div></div>
        <div class="r-quote">

let cur = 0;
const lhs = document.getElementById('lhs');
const rhs = document.getElementById('rhs');
const dots = document.getElementById('dots');
const title = document.getElementById('stepTitle');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  const s = STEPS[cur];
  lhs.innerHTML = s.lhs();
  rhs.innerHTML = s.rhs();
  title.textContent = s.title;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === STEPS.length - 1;
  nextBtn.textContent = cur === STEPS.length - 1 ? 'Done' : 'Next →';
  dots.innerHTML = STEPS.map((_, i) =>
    `<div class="dot${i === cur ? ' active' : ''}" onclick="goTo(${i})"></div>`
  ).join('');
  lhs.scrollTop = 0;
  rhs.scrollTop = 0;
}

function go(dir) { cur = Math.max(0, Math.min(STEPS.length - 1, cur + dir)); render(); }
function goTo(i) { cur = i; render(); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

render();
</script>
